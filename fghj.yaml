version: "1.0"
service:
  name: "inventory-service"
  internal_domain: "inventory.fghj.internal"
  build:
    context: "."
    dockerfile: "Dockerfile"
  ports:
    - "8080"
  environment:
    DB_HOST: postgres.fghj.internal
  dependencies:
    - kind: "infra"
      name: "postgres"
      image: "postgres:16"
      environment:
        POSTGRES_PASSWORD: devpassword
        POSTGRES_DB: inventory
      ports:
        - "5432"
